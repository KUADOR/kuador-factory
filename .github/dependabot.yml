# Dependabot: PR semanales hacia develop (nunca a main), agrupados para que no se vuelvan ruido. Las alertas y los
# arreglos de seguridad urgentes se activan aparte en Settings → Code security.
version: 2
updates:
  - package-ecosystem: maven
    directory: /kuador-board-api
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      parches-y-menores:
        update-types: [minor, patch]

  - package-ecosystem: npm # pnpm usa este ecosistema
    directory: /kuador-board-web
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      parches-y-menores:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/kuador-board-api, /kuador-board-web]
    target-branch: develop
    schedule: { interval: weekly, day: monday }

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    groups:
      acciones:
        patterns: ["*"]
