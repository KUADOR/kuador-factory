name: CI

# Flujo de ramas (docs/despliegue.md § Ramas y pipeline):
#   rama de trabajo → PR a develop: pruebas y escaneos, sin imágenes.
#   develop: imágenes con su SHA (escaneadas), publicación y despliegue a pruebas; pruebas y escaneos de código solo si el
#   PR no los pasó ya con el mismo código (marca «ci/arbol-probado»). El runner en Windows solo se prueba aquí.
#   develop → main (PR, merge commit): el PR no repite pruebas si develop ya publicó imágenes probadas de ese commit;
#   al fusionar solo se valida que sea el mismo código y se promueve la imagen ya probada.
#   hotfix/* → main: como no hay imagen de develop, corre el pipeline completo; después vuelve a develop.
# El plan gratuito de GitHub no protege ramas en repos privados: estas reglas las hace cumplir el trabajo «branches».
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  # Para relanzarlo a mano (Actions → CI → Run workflow) si un run se queda trabado.
  workflow_dispatch:

# El token del CI solo lee el repo, salvo donde un trabajo pide más (publicar imágenes).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Versiones fijas (y por digest) de las herramientas de seguridad: nada cambia sin un PR.
  GITLEAKS: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  TRIVY: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
  SEMGREP: semgrep/semgrep:1.183.0@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0

jobs:
  # Reglas de ramas y qué hace esta corrida: test (PR), integrate (develop), promote o full (main).
  branches:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      statuses: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      tree: ${{ steps.mode.outputs.tree }}
      tested: ${{ steps.mode.outputs.tested }}
      runner_os: ${{ steps.mode.outputs.runner_os }}
      tag: ${{ steps.mode.outputs.tag }}
      source: ${{ steps.mode.outputs.source }}
      owner: ${{ steps.mode.outputs.owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Log in to GHCR
        if: (github.event_name == 'push' && github.ref_name == 'main') || (github.event_name == 'pull_request' && github.base_ref == 'main')
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: mode
        name: Reglas de ramas
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse "HEAD^{tree}")" >> "$GITHUB_OUTPUT"
          # Windows cuenta el doble de minutos: el runner se prueba ahí solo en develop y en un hotfix a main.
          echo 'runner_os=["ubuntu-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
          git fetch --no-tags --quiet origin main
          # develop debe tener todo lo que se hizo en main. Los merge commits de cada release (develop → main) no
          # cuentan: solo traen lo que develop ya tiene. Lo que falta son commits propios de main (un hotfix).
          contains_main() {
            missing="$(git rev-list --no-merges origin/main ^HEAD)"
            [ -z "$missing" ] || {
              echo "::error::develop no contiene todo main (falta traer un hotfix: $(echo "$missing" | head -3 | xargs)). Fusiona main en develop y vuelve a intentar."; exit 1; }
          }
          short() { git rev-parse --short=7 "$1"; }

          if [ "$EVENT" = "pull_request" ]; then
            if [ "$BASE" = "develop" ]; then contains_main; fi
            if [ "$BASE" = "main" ] && [ "$HEAD_BRANCH" != "develop" ] && [[ "$HEAD_BRANCH" != hotfix/* ]]; then
              echo "::error::A main solo llegan develop o hotfix/*: lleva «$HEAD_BRANCH» a develop."; exit 1
            fi
            # PR develop → main: si develop ya probó este commit (sus imágenes solo se publican cuando pasan pruebas y
            # escaneos) y la fusión no cambia el código, no se repite nada. HEAD es la fusión de prueba; HEAD^2, develop.
            if [ "$BASE" = "main" ] && [ "$HEAD_BRANCH" = "develop" ]; then
              tested=true
              [ "$(git rev-parse "HEAD^{tree}")" = "$(git rev-parse "HEAD^2^{tree}")" ] || tested=false
              for app in kuador-board-api kuador-board-web; do
                docker buildx imagetools inspect "ghcr.io/$owner/$app:sha-$(short HEAD^2)" >/dev/null 2>&1 || tested=false
              done
              if [ "$tested" = true ]; then
                echo "develop ya probó sha-$(short HEAD^2): el PR no repite pruebas ni escaneos."
                echo "mode=release" >> "$GITHUB_OUTPUT"; exit 0
              fi
              echo "::warning::develop todavía no tiene imágenes probadas de sha-$(short HEAD^2) (¿su CI sigue corriendo?): se corren las pruebas."
            fi
            echo 'runner_os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            echo "mode=test" >> "$GITHUB_OUTPUT"; exit 0
          fi

          if [ "$BRANCH" = "develop" ]; then
            contains_main
            # Si el PR ya probó exactamente este código (su fusión de prueba dejó el mismo árbol que este merge), no se
            # repiten pruebas ni escaneos de código: solo se construyen y escanean las imágenes y se prueba Windows.
            # El PR deja la marca «ci/arbol-probado» en su último commit (trabajo «tested»).
            tested=false
            if git rev-parse --verify --quiet HEAD^2 >/dev/null; then
              marks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$(git rev-parse HEAD^2)/statuses" \
                --jq '.[] | select(.context == "ci/arbol-probado" and .state == "success") | .description' || true)"
              if echo "$marks" | grep -qx "$(git rev-parse "HEAD^{tree}")"; then tested=true; fi
            fi
            echo "tested=$tested" >> "$GITHUB_OUTPUT"
            if [ "$tested" = true ]; then
              echo "El PR ya probó este mismo código: no se repiten las pruebas."
              echo 'runner_os=["windows-latest"]' >> "$GITHUB_OUTPUT"
            fi
            echo "mode=integrate" >> "$GITHUB_OUTPUT"; echo "tag=sha-$(short HEAD)" >> "$GITHUB_OUTPUT"; exit 0
          fi

          if [ "$BRANCH" = "main" ]; then
            # De un PR develop → main con merge commit, el código probado es el segundo padre.
            source=HEAD
            if git rev-parse --verify --quiet HEAD^2 >/dev/null; then source=HEAD^2; fi
            same_code=false
            [ "$(git rev-parse "HEAD^{tree}")" = "$(git rev-parse "$source^{tree}")" ] && same_code=true
            images=true
            for app in kuador-board-api kuador-board-web; do
              docker buildx imagetools inspect "ghcr.io/$owner/$app:sha-$(short "$source")" >/dev/null 2>&1 || images=false
            done
            echo "tag=sha-$(short HEAD)" >> "$GITHUB_OUTPUT"
            echo "source=sha-$(short "$source")" >> "$GITHUB_OUTPUT"
            if [ "$same_code" = true ] && [ "$images" = true ]; then
              echo "Se promueve la imagen ya probada en develop: sha-$(short "$source")."
              echo "mode=promote" >> "$GITHUB_OUTPUT"
            else
              echo "Sin imagen probada en develop para este código (p. ej. un hotfix): corre el pipeline completo."
              echo "mode=full" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          echo "mode=test" >> "$GITHUB_OUTPUT"

  api:
    needs: branches
    if: >
      needs.branches.outputs.mode != 'promote' && needs.branches.outputs.mode != 'release' &&
      needs.branches.outputs.tested != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kuador-board-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Incluye las pruebas de integración con Testcontainers (el runner ya trae Docker).
      - run: ./mvnw -B verify
      # Dependencias de la API con fallas críticas o altas que ya tienen arreglo: frenan. Usa la caché de Maven que dejó
      # el build (sin ella, Trivy le pediría a Maven Central cada BOM y lo bloquean por exceso de pedidos).
      - name: Dependencias (Trivy)
        run: >
          docker run --rm -v "$GITHUB_WORKSPACE":/repo -v "$HOME/.m2":/root/.m2:ro "$TRIVY"
          fs /repo/kuador-board-api --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --offline-scan
          --skip-dirs /repo/kuador-board-api/target --exit-code 1 --no-progress

  web:
    needs: branches
    if: >
      needs.branches.outputs.mode != 'promote' && needs.branches.outputs.mode != 'release' &&
      needs.branches.outputs.tested != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kuador-board-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: kuador-board-web/.nvmrc
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

  # La web de verdad contra la API de verdad y una base desechable: los recorridos que no pueden romperse (entrar, el
  # tablero, la lista, el flujo). El mismo script que se corre en una PC (kuador-board-web/e2e/entorno.sh).
  e2e:
    needs: branches
    if: >
      needs.branches.outputs.mode != 'promote' && needs.branches.outputs.mode != 'release' &&
      needs.branches.outputs.tested != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kuador-board-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: kuador-board-web/.nvmrc
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          E2E_BUILD: '1'
      - name: Guardar las trazas si algo falló
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-resultados
          path: kuador-board-web/e2e/resultados
          retention-days: 7

  # El runner (npx @kuador-npm/runner): sin dependencias. Linux en los PR; Windows en develop (y Linux si el PR no lo
  # probó ya). macOS no (en un repo privado sus minutos cuestan 10 veces más y la cuenta no tiene esos runners).
  runner:
    needs: branches
    if: needs.branches.outputs.mode != 'promote' && needs.branches.outputs.mode != 'release'
    strategy:
      matrix:
        os: ${{ fromJSON(needs.branches.outputs.runner_os) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: kuador-runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm test
      - run: node bin/kuador-runner.js --version

  # Secretos en todo el historial, patrones peligrosos en el código y dependencias de la web con fallas conocidas.
  # Frena solo lo grave: un secreto, un hallazgo ERROR de Semgrep o una falla crítica/alta con arreglo.
  security:
    needs: branches
    if: >
      needs.branches.outputs.mode != 'promote' && needs.branches.outputs.mode != 'release' &&
      needs.branches.outputs.tested != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Secretos (gitleaks)
        run: docker run --rm -v "$GITHUB_WORKSPACE":/repo "$GITLEAKS" git /repo --config /repo/.gitleaks.toml --redact --no-banner
      - name: Código (Semgrep)
        run: >
          docker run --rm -v "$GITHUB_WORKSPACE":/src -w /src "$SEMGREP"
          semgrep scan --config p/default --severity ERROR --error --metrics off
      - name: Dependencias de la web y el runner (Trivy)
        run: >
          docker run --rm -v "$GITHUB_WORKSPACE":/repo "$TRIVY"
          fs /repo --skip-dirs /repo/kuador-board-api --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed
          --exit-code 1 --no-progress

  # PR a develop con todo en verde: deja en su último commit la marca del árbol probado, para que el push a develop no
  # repita estas pruebas si el merge da el mismo código. En PRs de Dependabot el token no puede escribir: sin marca,
  # develop prueba de nuevo.
  tested:
    needs: [branches, api, web, e2e, runner, security]
    if: github.event_name == 'pull_request' && github.base_ref == 'develop' && needs.branches.outputs.mode == 'test'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Marcar el árbol probado
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          TREE: ${{ needs.branches.outputs.tree }}
        run: >
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=success -f context=ci/arbol-probado
          -f description="$TREE" >/dev/null
          || echo "::warning::No se pudo dejar la marca: develop volverá a correr las pruebas."

  # Construye las dos imágenes (develop, o main sin imagen probada), en paralelo con las pruebas, y las escanea: el
  # sistema base y las librerías que de verdad van a producción. Deja las capas en la caché; no publica nada.
  image:
    needs: branches
    if: needs.branches.outputs.mode == 'integrate' || needs.branches.outputs.mode == 'full'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [kuador-board-api, kuador-board-web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.app }}
          push: false
          load: true
          tags: ${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Imagen (Trivy)
        env:
          APP: ${{ matrix.app }}
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY"
          image "$APP:ci" --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --no-progress --timeout 15m

  # Con todo en verde: publica en GHCR con su SHA (y «develop» o «latest» según la rama). Las capas ya están en la
  # caché que dejó «image», así que aquí solo se arman y se suben.
  publish:
    needs: [branches, api, web, e2e, runner, security, image]
    # api, web, e2e y security pueden venir saltados (el PR ya probó este código); fallados o cancelados, nunca.
    if: >
      !cancelled() && (needs.branches.outputs.mode == 'integrate' || needs.branches.outputs.mode == 'full') &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [kuador-board-api, kuador-board-web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ needs.branches.outputs.owner }}/${{ matrix.app }}
          tags: |
            type=raw,value=${{ needs.branches.outputs.tag }}
            type=raw,value=develop,enable=${{ needs.branches.outputs.mode == 'integrate' }}
            type=raw,value=latest,enable=${{ needs.branches.outputs.mode == 'full' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}

  # main con el mismo código que se probó en develop: no se reconstruye ni se vuelve a probar. La misma imagen (mismo
  # digest) recibe «latest» y el SHA de main, para desplegar y para volver atrás.
  promote:
    needs: branches
    if: needs.branches.outputs.mode == 'promote'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [kuador-board-api, kuador-board-web]
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promover la imagen de develop
        env:
          IMAGE: ghcr.io/${{ needs.branches.outputs.owner }}/${{ matrix.app }}
          SOURCE: ${{ needs.branches.outputs.source }}
          TAG: ${{ needs.branches.outputs.tag }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" --tag "$IMAGE:$TAG" "$IMAGE:$SOURCE"

  # Despliegue a pruebas (develop). Se omite hasta que existan los secretos del entorno «staging» (docs/despliegue.md).
  deploy-staging:
    needs: [branches, publish]
    if: needs.branches.outputs.mode == 'integrate'
    runs-on: ubuntu-latest
    environment: staging
    permissions: {}
    steps:
      - name: Redesplegar pruebas en Dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          API_ID: ${{ secrets.DOKPLOY_API_APPLICATION_ID }}
          WEB_ID: ${{ secrets.DOKPLOY_WEB_APPLICATION_ID }}
        run: |
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ]; then
            echo "::warning::Sin secretos de Dokploy en este entorno: la imagen quedó publicada, pero hay que desplegarla con el botón Deploy."; exit 0
          fi
          for id in "$API_ID" "$WEB_ID"; do
            [ -n "$id" ] || continue
            # Solo un 200 es un despliegue pedido: una redirección (p. ej. al login de otra aplicación) es una URL equivocada.
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "${DOKPLOY_URL%/}/api/application.deploy" \
              -H "x-api-key: ${DOKPLOY_API_KEY}" -H "Content-Type: application/json" \
              -d "{\"applicationId\":\"${id}\"}")
            if [ "$code" != "200" ]; then
              echo "::error::Dokploy respondió $code al pedir el despliegue: revisa DOKPLOY_URL (la del panel de Dokploy), la clave y los IDs."; exit 1
            fi
          done

  # Producción: después de promover (lo normal) o de publicar un hotfix. La clave de Dokploy vale todo el servidor:
  # solo la ve este trabajo, solo desde main y dentro del entorno «production».
  deploy:
    needs: [branches, publish, promote]
    if: >
      !cancelled() && github.ref_name == 'main' && github.event_name == 'push' &&
      (needs.promote.result == 'success' || (needs.branches.outputs.mode == 'full' && needs.publish.result == 'success'))
    runs-on: ubuntu-latest
    environment: production
    permissions: {}
    steps:
      - name: Redesplegar en Dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          API_ID: ${{ secrets.DOKPLOY_API_APPLICATION_ID }}
          WEB_ID: ${{ secrets.DOKPLOY_WEB_APPLICATION_ID }}
        run: |
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ]; then
            echo "::warning::Sin secretos de Dokploy en este entorno: la imagen quedó publicada, pero hay que desplegarla con el botón Deploy."; exit 0
          fi
          for id in "$API_ID" "$WEB_ID"; do
            [ -n "$id" ] || continue
            # Solo un 200 es un despliegue pedido: una redirección (p. ej. al login de otra aplicación) es una URL equivocada.
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "${DOKPLOY_URL%/}/api/application.deploy" \
              -H "x-api-key: ${DOKPLOY_API_KEY}" -H "Content-Type: application/json" \
              -d "{\"applicationId\":\"${id}\"}")
            if [ "$code" != "200" ]; then
              echo "::error::Dokploy respondió $code al pedir el despliegue: revisa DOKPLOY_URL (la del panel de Dokploy), la clave y los IDs."; exit 1
            fi
          done
