name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Para relanzarlo a mano (Actions → CI → Run workflow) si un run se queda trabado.
  workflow_dispatch:

# El token del CI solo lee el repo, salvo donde un trabajo pide más (publicar imágenes).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kuador-board-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Incluye las pruebas de integración con Testcontainers (el runner ya trae Docker).
      - run: ./mvnw -B verify

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kuador-board-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: kuador-board-web/.nvmrc
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

  # Construye las dos imágenes en cada corrida; solo desde main las publica en GHCR. Dokploy las baja de ahí.
  image:
    needs: [api, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [kuador-board-api, kuador-board-web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.app }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # Opcional: pide a Dokploy que redespliegue. Se omite hasta que existan los secretos (docs/despliegue.md).
  # La clave de Dokploy vale todo el servidor: solo la ve este trabajo, solo desde main y dentro del entorno «production»
  # (en GitHub → Settings → Environments → production: «Deployment branches» = main; así una rama con el workflow
  # cambiado no puede leerla).
  deploy:
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions: {}
    steps:
      - name: Redesplegar en Dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          API_ID: ${{ secrets.DOKPLOY_API_APPLICATION_ID }}
          WEB_ID: ${{ secrets.DOKPLOY_WEB_APPLICATION_ID }}
        run: |
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ]; then
            echo "Sin secretos de Dokploy: se despliega con el botón Deploy."; exit 0
          fi
          for id in "$API_ID" "$WEB_ID"; do
            [ -n "$id" ] || continue
            curl -fsS -X POST "${DOKPLOY_URL%/}/api/application.deploy" \
              -H "x-api-key: ${DOKPLOY_API_KEY}" -H "Content-Type: application/json" \
              -d "{\"applicationId\":\"${id}\"}"
          done
