name: Publicar runner

# Sube @kuador-npm/runner a npm al empujar una etiqueta runner-vX.Y.Z (la versión debe coincidir con package.json).
# Sin tokens guardados: npm confía en este workflow (Trusted Publishing por OIDC). La versión queda «en espera» (stage
# publish) hasta que la persona dueña la aprueba con su 2FA en npmjs.com: nadie publica solo con acceso al repo.
on:
  push:
    tags: ['runner-v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kuador-runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # «npm stage publish» llegó en npm 12.
      - run: npm install -g npm@12.2.3
      - name: La etiqueta coincide con la versión
        run: |
          expected="runner-v$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "$expected" ] || { echo "La etiqueta $GITHUB_REF_NAME no coincide con $expected"; exit 1; }
      - run: npm test
      - run: npm stage publish --access public
