apiVersion: 1
contactPoints:
  - orgId: 1
    name: Correo
    receivers:
      - uid: correo
        type: email
        settings:
          addresses: ${ALERT_EMAILS}
          singleEmail: true
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: Correo
    group_by: [alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
