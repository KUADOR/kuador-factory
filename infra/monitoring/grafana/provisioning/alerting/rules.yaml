# Alertas (se envían por correo a ALERT_EMAILS). Se editan aquí, no en la interfaz.
apiVersion: 1
groups:
- orgId: 1
  name: Disponibilidad
  folder: Kuador
  interval: 1m
  rules:
  - uid: web-caida
    title: La web no responde
    condition: C
    for: 2m
    noDataState: Alerting
    execErrState: Error
    annotations:
      summary: go.kuador.com no responde desde hace 2 minutos.
    labels:
      severidad: critica
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        expr: min(probe_success{job="probes", probe="web"})
        instant: true
        range: false
        refId: A
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
  - uid: api-caida
    title: La API no responde
    condition: C
    for: 2m
    noDataState: Alerting
    execErrState: Error
    annotations:
      summary: La API no responde por su dominio desde hace 2 minutos.
    labels:
      severidad: critica
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        expr: min(probe_success{job="probes", probe="api"})
        instant: true
        range: false
        refId: A
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
  - uid: api-sin-metricas
    title: La API no entrega métricas
    condition: C
    for: 3m
    noDataState: Alerting
    execErrState: Error
    annotations:
      summary: 'Alloy no puede leer la API por la red interna: puede estar caída o reiniciándose.'
    labels:
      severidad: critica
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        expr: min(up{job="kuador-api"})
        instant: true
        range: false
        refId: A
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
  - uid: certificado
    title: Certificado HTTPS por vencer
    condition: C
    for: 1h
    noDataState: OK
    execErrState: Error
    annotations:
      summary: 'Un certificado HTTPS vence en menos de 14 días: revisa Traefik en Dokploy.'
    labels:
      severidad: aviso
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        expr: min((probe_ssl_earliest_cert_expiry{job="probes"} - time()) / 86400)
        instant: true
        range: false
        refId: A
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 14
- orgId: 1
  name: Errores
  folder: Kuador
  interval: 1m
  rules:
  - uid: errores-5xx
    title: Errores 5xx en la API
    condition: C
    for: 0s
    noDataState: OK
    execErrState: Error
    annotations:
      summary: Más de 5 respuestas con error del servidor en 5 minutos.
    labels:
      severidad: critica
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        expr: sum(increase(http_server_requests_seconds_count{job="kuador-api", status=~"5.."}[5m]))
        instant: true
        range: false
        refId: A
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 5
  - uid: errores-log
    title: Errores en los logs
    condition: C
    for: 0s
    noDataState: OK
    execErrState: Error
    annotations:
      summary: Se registraron errores en los logs. Revisa el tablero «Kuador Go», sección Logs.
    labels:
      severidad: aviso
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: loki
      model:
        expr: sum(count_over_time({level="ERROR"}[5m]))
        queryType: instant
        refId: A
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
  - uid: agentes-fallando
    title: Agentes fallando
    condition: C
    for: 0s
    noDataState: OK
    execErrState: Error
    annotations:
      summary: Al menos 3 trabajos de agentes fallaron en 30 minutos (¿clave de IA, límite del proveedor?).
    labels:
      severidad: aviso
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        expr: sum(increase(kuador_agent_runs_total{outcome="FAILED"}[30m]))
        instant: true
        range: false
        refId: A
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: ge
            params:
            - 3
  - uid: base-saturada
    title: Conexiones a la base saturadas
    condition: C
    for: 5m
    noDataState: OK
    execErrState: Error
    annotations:
      summary: Hay peticiones esperando una conexión a la base desde hace 5 minutos.
    labels:
      severidad: critica
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        expr: max(hikaricp_connections_pending{job="kuador-api"})
        instant: true
        range: false
        refId: A
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
- orgId: 1
  name: Servidor
  folder: Kuador
  interval: 1m
  rules:
  - uid: disco-lleno
    title: Disco casi lleno
    condition: C
    for: 10m
    noDataState: OK
    execErrState: Error
    annotations:
      summary: El disco del servidor pasa del 85%.
    labels:
      severidad: critica
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        expr: max(1 - node_filesystem_avail_bytes{job="servidor", mountpoint="/"} / node_filesystem_size_bytes{job="servidor", mountpoint="/"})
        instant: true
        range: false
        refId: A
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0.85
  - uid: memoria-baja
    title: Memoria del servidor baja
    condition: C
    for: 10m
    noDataState: OK
    execErrState: Error
    annotations:
      summary: Queda menos del 10% de memoria libre en el servidor.
    labels:
      severidad: critica
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        expr: min(node_memory_MemAvailable_bytes{job="servidor"} / node_memory_MemTotal_bytes{job="servidor"})
        instant: true
        range: false
        refId: A
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 0.1
  - uid: memoria-api
    title: La API casi sin memoria
    condition: C
    for: 10m
    noDataState: OK
    execErrState: Error
    annotations:
      summary: La API usa más del 90% de su memoria desde hace 10 minutos.
    labels:
      severidad: aviso
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        expr: max(sum by (instance) (jvm_memory_used_bytes{job="kuador-api", area="heap"}) / sum by (instance) (jvm_memory_max_bytes{job="kuador-api", area="heap"} > 0))
        instant: true
        range: false
        refId: A
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0.9
