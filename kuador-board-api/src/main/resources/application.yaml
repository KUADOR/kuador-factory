server:
  port: ${PORT:8091}
  # Solo escucha en la máquina local hasta que exista autenticación.
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  config:
    # Variables locales no versionadas (ver .env.example).
    import: optional:file:.env[.properties]
  application:
    name: kuador-board-api
  task:
    scheduling:
      # Las tareas programadas no comparten un solo hilo: revisar el correo no atrasa el latido del tablero en vivo.
      pool:
        size: 4
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kuador_board}
    username: ${SPRING_DATASOURCE_USERNAME:kuador}
    password: ${SPRING_DATASOURCE_PASSWORD:kuador}
    hikari:
      # Por réplica. Las peticiones y los listeners de eventos comparten el pool: con 10 (lo de fábrica), una ráfaga de
      # cambios dejaba a las peticiones esperando. Postgres admite 100 en total: dos réplicas usan 42 con la escucha.
      maximum-pool-size: ${BOARD_DB_POOL:20}
      # Si de verdad no hay conexión, fallar en 10 s y no en 30: una petición colgada medio minuto es peor que un error.
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false # Flyway crea las tablas (V4).
      completion-mode: delete
      # Si la API se cae antes de que un listener termine, el evento se reintenta al arrancar.
      republish-outstanding-events-on-restart: true
  mail:
    # Solo aplica si hay SPRING_MAIL_HOST (puerto 587 con STARTTLS).
    properties:
      # Que un SMTP lento no deje colgada una petición.
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
  servlet:
    multipart:
      # Adjuntos: el máximo por archivo lo decide board.storage.max-file-size (un poco más aquí por el sobre del formulario).
      max-file-size: ${BOARD_STORAGE_MAX_FILE_SIZE:25MB}
      max-request-size: 26MB
  mvc:
    problemdetails:
      enabled: true

management:
  # En producción, MANAGEMENT_SERVER_PORT=9464: las métricas quedan en un puerto que Traefik no publica (solo la red
  # interna, donde las lee Alloy). La salud pública sigue en el puerto de la API como /livez y /readyz.
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
  metrics:
    tags:
      application: kuador-board-api
    distribution:
      # Para calcular percentiles (p95) de los tiempos de respuesta en Grafana.
      percentiles-histogram:
        http.server.requests: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

board:
  # URL con la que los clientes de IA (Claude Code, Codex...) llegan a esta API: va en el kit de agentes locales.
  public-url: ${BOARD_PUBLIC_URL:http://localhost:8091}
  # URL del tablero web (la GitHub App vuelve ahí después de registrarse o instalarse).
  web-url: ${BOARD_WEB_URL:http://localhost:3600}
  # true cuando la API tiene dominio propio: por el host de public-url solo entran /mcp, el kit, el webhook y la salud.
  public-host-gate: ${BOARD_PUBLIC_HOST_GATE:false}
  # Secreto compartido con la web (el mismo valor en los dos servicios): confiar en la IP que reenvía y, con el
  # dominio público protegido, abrir el resto de la API solo a la web.
  web:
    secret: ${BOARD_WEB_SECRET:}
  push:
    # Notificaciones push de la app instalada: claves VAPID (P-256, base64url). Sin ellas, el canal no está disponible.
    vapid-public-key: ${BOARD_PUSH_VAPID_PUBLIC_KEY:}
    vapid-private-key: ${BOARD_PUSH_VAPID_PRIVATE_KEY:}
    subject: ${BOARD_PUSH_SUBJECT:mailto:no-reply@kuador.com}
  agents:
    # Los agentes del tablero usan la clave de IA de cada espacio (Conexiones → IA); sin ella, cada asignación queda SKIPPED.
    model: ${BOARD_AGENTS_MODEL:claude-opus-5-5}
    effort: ${BOARD_AGENTS_EFFORT:medium}
    # Si el modelo declina por sus clasificadores de seguridad, el servidor reintenta con otro modelo.
    refusal-fallback: ${BOARD_AGENTS_REFUSAL_FALLBACK:true}
    # Cuántos agentes del servidor trabajan a la vez: en toda la instancia y por espacio. El resto espera su turno.
    max-concurrent: ${BOARD_AGENTS_MAX_CONCURRENT:24}
    max-per-workspace: ${BOARD_AGENTS_MAX_PER_WORKSPACE:6}
  # 32 bytes en base64 (openssl rand -base64 32). Cifra los tokens de GitHub guardados en la base.
  secrets-key: ${BOARD_SECRETS_KEY:}
  github:
    api-url: ${BOARD_GITHUB_API_URL:https://api.github.com}
  # Aplicaciones de la plataforma registradas con cada proveedor: con ellas, Gmail y Outlook se conectan con un clic
  # (Conexiones → Sistemas de la empresa). Sin ellas, cada empresa pega la suya. Ver docs/despliegue.md.
  connectors:
    google:
      client-id: ${BOARD_CONNECTORS_GOOGLE_CLIENT_ID:}
      client-secret: ${BOARD_CONNECTORS_GOOGLE_CLIENT_SECRET:}
    microsoft:
      client-id: ${BOARD_CONNECTORS_MICROSOFT_CLIENT_ID:}
      client-secret: ${BOARD_CONNECTORS_MICROSOFT_CLIENT_SECRET:}
  platform:
    # Correos (separados por coma) de quienes administran la plataforma: planes y licencias de todos los espacios.
    admins: ${BOARD_PLATFORM_ADMINS:}
  storage:
    # Adjuntos en un almacenamiento compatible con S3 (Garage en la red interna). Sin endpoint, deshabilitados.
    max-file-size: ${BOARD_STORAGE_MAX_FILE_SIZE:25MB}
    s3:
      endpoint: ${BOARD_STORAGE_S3_ENDPOINT:}
      region: ${BOARD_STORAGE_S3_REGION:garage}
      bucket: ${BOARD_STORAGE_S3_BUCKET:kuador-adjuntos}
      access-key: ${BOARD_STORAGE_S3_ACCESS_KEY:}
      secret-key: ${BOARD_STORAGE_S3_SECRET_KEY:}
  telegram:
    # Bot para los avisos (lo crea @BotFather). Sin token, Telegram no aparece como canal.
    bot-token: ${BOARD_TELEGRAM_BOT_TOKEN:}
    bot-username: ${BOARD_TELEGRAM_BOT_USERNAME:}
  mail:
    from: ${BOARD_MAIL_FROM:Kuador Go <no-reply@kuador.com>}
    # Solo desarrollo: sin SMTP (SPRING_MAIL_HOST vacío), escribe el código del alta en el log.
    log-codes: ${BOARD_MAIL_LOG_CODES:false}
  bootstrap:
    admin-email: ${BOARD_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOARD_BOOTSTRAP_ADMIN_PASSWORD:}
