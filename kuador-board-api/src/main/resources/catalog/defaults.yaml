workflowTemplates:
  - key: SOFTWARE
    name: Software
    description: "Backlog → Por hacer → En progreso → En QA → Hecho. Épicas, historias, tareas y bugs. Admite metodología, documentos y repositorio."
    kind: SOFTWARE
    columns:
      - { key: BACKLOG, name: Backlog, category: TODO }
      - { key: TODO, name: Por hacer, category: TODO }
      - { key: IN_PROGRESS, name: En progreso, category: IN_PROGRESS }
      - { key: IN_REVIEW, name: En QA, category: IN_PROGRESS }
      - { key: DONE, name: Hecho, category: DONE }
    issueTypes:
      - { type: EPIC, label: Épica }
      - { type: STORY, label: Historia }
      - { type: TASK, label: Tarea }
      - { type: BUG, label: Bug }
    # Equipo de agentes que trae un tablero nuevo (se edita en Configuración → Equipo).
    agents: [PRODUCT_OWNER, BACKEND, FRONTEND, QA]
  - key: SOFTWARE_FACTORY
    name: Fábrica de software
    description: "Personas y agentes por etapas: el PO refina, una persona aprueba, Arquitectura diseña, Desarrollo construye, QA valida y Release entrega con aprobación humana."
    kind: SOFTWARE
    columns:
      - { key: BACKLOG, name: Backlog, category: TODO }
      - { key: REFINEMENT, name: Refinamiento, category: IN_PROGRESS }
      - { key: APPROVAL, name: Aprobación, category: IN_PROGRESS }
      - { key: DESIGN, name: Diseño, category: IN_PROGRESS }
      - { key: DEVELOPMENT, name: Desarrollo, category: IN_PROGRESS }
      - { key: QA, name: QA, category: IN_PROGRESS }
      - { key: PR_REVIEW, name: Revisión de PR, category: IN_PROGRESS }
      - { key: RELEASE, name: Release, category: IN_PROGRESS }
      - { key: DONE, name: Hecho, category: DONE }
    issueTypes:
      - { type: EPIC, label: Épica }
      - { type: STORY, label: Historia }
      - { type: TASK, label: Tarea }
      - { type: BUG, label: Bug }
    # Equipo de agentes que trae un tablero nuevo: los de las etapas más DevOps (las tareas de infraestructura de una épica)
    # y el revisor de PR (si una puerta la revisa un agente).
    agents: [PRODUCT_OWNER, UX_UI, ARCHITECT, BACKEND, FRONTEND, DEVOPS, QA, RELEASE, PR_REVIEWER]
    # Quién cubre cada etapa. Las puertas solo las cierra una persona con el rol aprobador.
    # En Diseño, las épicas pasan primero por UI/UX (pantallas) y después por el Arquitecto, que no las entrega sin el
    # diagrama de la solución.
    stages:
      - { column: REFINEMENT, roles: [PRODUCT_OWNER] }
      - { column: APPROVAL, roles: [], gate: true, approvers: [OWNER], rejectTo: REFINEMENT }
      - { column: DESIGN, roles: [ARCHITECT], epicFirst: [UX_UI], requires: [{ kind: DIAGRAM }] }
      - { column: DEVELOPMENT, roles: [BACKEND, FRONTEND] }
      - { column: QA, roles: [QA] }
      - { column: PR_REVIEW, roles: [], gate: true, approvers: [OWNER], rejectTo: DEVELOPMENT }
      - { column: RELEASE, roles: [RELEASE], gate: true, approvers: [OWNER], rejectTo: DEVELOPMENT }
    # Pasos permitidos: avanzar etapa por etapa, saltar Diseño si no hace falta y volver atrás al corregir.
    transitions:
      - { from: BACKLOG, to: REFINEMENT }
      - { from: REFINEMENT, to: BACKLOG }
      - { from: REFINEMENT, to: APPROVAL }
      - { from: APPROVAL, to: REFINEMENT }
      - { from: APPROVAL, to: DESIGN }
      - { from: APPROVAL, to: DEVELOPMENT }
      - { from: DESIGN, to: DEVELOPMENT }
      - { from: DEVELOPMENT, to: DESIGN }
      - { from: DEVELOPMENT, to: QA }
      - { from: QA, to: DEVELOPMENT }
      - { from: QA, to: PR_REVIEW }
      - { from: PR_REVIEW, to: DEVELOPMENT }
      - { from: PR_REVIEW, to: RELEASE }
      - { from: RELEASE, to: DEVELOPMENT }
      - { from: RELEASE, to: DONE }
  - key: SALES
    name: Ventas
    description: "Prospecto → Investigación → Contactado → Preparar propuesta → Revisión de propuesta → Propuesta enviada → Negociación → Ganado / Perdido. Los agentes preparan (ficha del prospecto, propuesta) y una persona contacta, aprueba y envía."
    kind: GENERAL
    columns:
      - { key: PROSPECT, name: Prospecto, category: TODO }
      - { key: RESEARCH, name: Investigación, category: IN_PROGRESS }
      - { key: CONTACTED, name: Contactado, category: IN_PROGRESS }
      - { key: PROPOSAL_DRAFT, name: Preparar propuesta, category: IN_PROGRESS }
      - { key: PROPOSAL_REVIEW, name: Revisión de propuesta, category: IN_PROGRESS }
      - { key: PROPOSAL, name: Propuesta enviada, category: IN_PROGRESS }
      - { key: NEGOTIATION, name: Negociación, category: IN_PROGRESS }
      - { key: WON, name: Ganado, category: DONE }
      - { key: LOST, name: Perdido, category: DONE }
    issueTypes:
      - { type: TASK, label: Oportunidad }
      - { type: EPIC, label: Campaña }
    # El Analista arma la ficha del prospecto y Marketing redacta la propuesta; una persona contacta, la aprueba y la envía.
    stages:
      - { column: RESEARCH, roles: [ANALYST] }
      - { column: PROPOSAL_DRAFT, roles: [MARKETING] }
      - { column: PROPOSAL_REVIEW, roles: [], gate: true, approvers: [], rejectTo: PROPOSAL_DRAFT }
    agents: [ANALYST, MARKETING]
  - key: MARKETING
    name: Marketing
    description: "Ideas → Brief → Redacción → Diseño → Revisión → Programado → Publicado → Medición → Medido. Para promocionar un producto o servicio: Marketing escribe, Diseño hace las imágenes, una persona aprueba y publica, y el Analista mide qué funcionó."
    kind: GENERAL
    columns:
      - { key: IDEAS, name: Ideas, category: TODO }
      - { key: BRIEF, name: Brief, category: IN_PROGRESS }
      - { key: COPY, name: Redacción, category: IN_PROGRESS }
      - { key: DESIGN, name: Diseño, category: IN_PROGRESS }
      - { key: REVIEW, name: Revisión, category: IN_PROGRESS }
      - { key: SCHEDULED, name: Programado, category: IN_PROGRESS }
      - { key: PUBLISHED, name: Publicado, category: IN_PROGRESS }
      - { key: MEASURE, name: Medición, category: IN_PROGRESS }
      - { key: DONE, name: Medido, category: DONE }
    issueTypes:
      - { type: TASK, label: Pieza }
      - { type: EPIC, label: Campaña }
    # Marketing arma el brief y escribe, Diseño hace las imágenes y una persona aprueba (puerta) y publica. Con los
    # resultados de la pieza adjuntos, el Analista mide qué funcionó.
    stages:
      - { column: BRIEF, roles: [MARKETING] }
      - { column: COPY, roles: [MARKETING] }
      - { column: DESIGN, roles: [DESIGNER] }
      - { column: REVIEW, roles: [], gate: true, approvers: [], rejectTo: COPY }
      - { column: MEASURE, roles: [ANALYST] }
    agents: [MARKETING, DESIGNER, ANALYST]
  - key: TASKS
    name: Tareas simples
    description: "Pendiente → Haciendo → Revisión → Listo. Para pendientes de oficina o cualquier lista de trabajo; lo que entrega un agente pasa a Revisión para que una persona lo apruebe."
    kind: GENERAL
    columns:
      - { key: TODO, name: Pendiente, category: TODO }
      - { key: DOING, name: Haciendo, category: IN_PROGRESS }
      - { key: REVIEW, name: Revisión, category: IN_PROGRESS }
      - { key: DONE, name: Listo, category: DONE }
    issueTypes:
      - { type: TASK, label: Tarea }
      - { type: EPIC, label: Grupo }
    stages:
      - { column: REVIEW, roles: [], gate: true, approvers: [], rejectTo: DOING }
    agents: [ANALYST]

methodologies:
  - key: SDD
    name: Spec Driven Development (Spec Kit)
    summary: "La especificación dirige la implementación: primero el qué y el porqué (spec), luego el cómo (plan), después las tareas. Todo se valida contra la constitución del proyecto."
    agentRules:
      - "No se implementa nada sin una spec aprobada por una persona."
      - "La spec describe qué y por qué, nunca cómo. Marca cada duda con [NEEDS CLARIFICATION: pregunta] en vez de suponer."
      - "Cada requisito es verificable (FR-001…) y cada criterio de éxito es medible (SC-001…)."
      - "El plan incluye una verificación explícita contra la constitución; toda excepción se justifica por escrito."
      - "Las tareas salen del plan, en orden, con las pruebas antes de la implementación."
      - "QA valida contra los escenarios de aceptación de la spec, no contra su propia interpretación."
    documents:
      - kind: CONSTITUTION
        label: "Constitución"
        scope: PROJECT
        required: true
        purpose: "Principios no negociables del proyecto; todo plan se valida contra ella."
        pathPattern: ".specify/memory/constitution.md"
        writtenBy: null
        condition: ALWAYS
        agentInstructions: null
        template: |
          # Constitución de {project}

          Principios no negociables del proyecto. Todo plan se verifica contra ellos; cualquier excepción
          se justifica por escrito en el plan.

          ## Principios fundamentales

          ### I. [Nombre del principio]

          [Regla concreta y verificable. Ej.: "Arquitectura hexagonal: el dominio no depende de frameworks;
          una prueba de arquitectura falla el build si se rompe un límite".]

          ### II. [Nombre del principio]

          [Regla concreta y verificable.]

          ### III. Pruebas (NO NEGOCIABLE)

          [Qué se prueba, cuándo (antes o después de implementar) y qué bloquea una entrega.]

          ## Restricciones

          - Stack: [lenguajes, frameworks, versiones]
          - Seguridad y datos: [reglas de privacidad, secretos, cumplimiento]

          ## Entrega y controles de calidad

          [Qué debe pasar antes de integrar: CI, revisión, contratos.]

          ## Gobernanza

          Esta constitución prevalece sobre otras prácticas. Cambiarla requiere [aprobación], una nota de
          impacto y subir la versión (MAYOR: quita o redefine principios; MENOR: agrega; PARCHE: aclara).

          **Versión**: 1.0.0 | **Ratificada**: {date} | **Última modificación**: {date}
      - kind: PRODUCT
        label: "Producto"
        scope: PROJECT
        required: false
        purpose: "Usuarios, propósito y posicionamiento."
        pathPattern: "PRODUCT.md"
        writtenBy: null
        condition: ALWAYS
        agentInstructions: null
        template: |
          # Producto: {project}

          ## Usuarios

          - **Núcleo:** [quién usa el producto y en qué situación]
          - **Secundario:** [otros usuarios]

          ## Propósito

          [Qué problema resuelve y cómo se mide el éxito.]

          ## Posicionamiento

          [Qué lo diferencia de las alternativas.]

          ## Contexto operativo

          [Restricciones del negocio, regulación, idioma, horarios, integraciones locales.]
      - kind: ARCHITECTURE
        label: "Arquitectura"
        scope: PROJECT
        required: false
        purpose: "Stack, módulos y decisiones técnicas vigentes."
        pathPattern: "docs/architecture.md"
        writtenBy: null
        condition: ALWAYS
        agentInstructions: null
        template: |
          # Arquitectura de {project}

          ## Stack

          | Área | Tecnología |
          |---|---|
          | Backend | [ej. Java 25 · Spring Boot · Modulith] |
          | Frontend | [ej. Next.js · React] |
          | Datos | [ej. PostgreSQL + Flyway] |

          ## Módulos

          | Módulo | Responsabilidad | API pública |
          |---|---|---|
          | [módulo] | [qué hace] | [interfaces o eventos] |

          ## Integraciones

          [Servicios externos y cómo se aíslan.]

          ## Decisiones (ADR)

          - **ADR-001 · [título]** ({date}): [decisión y motivo].
      - kind: GLOSSARY
        label: "Glosario"
        scope: PROJECT
        required: false
        purpose: "Términos del negocio para que personas y agentes hablen igual."
        pathPattern: "docs/glossary.md"
        writtenBy: null
        condition: ALWAYS
        agentInstructions: null
        template: |
          # Glosario de {project}

          | Término | Significado | No confundir con |
          |---|---|---|
          | [término] | [definición en el lenguaje del negocio] | [término parecido] |
      - kind: AGENT_RULES
        label: "Reglas para agentes"
        scope: PROJECT
        required: false
        purpose: "Convenciones y prohibiciones adicionales para los agentes."
        pathPattern: "AGENTS.md"
        writtenBy: null
        condition: ALWAYS
        agentInstructions: null
        template: |
          # Reglas para agentes · {project}

          Instrucciones que todo agente sigue al trabajar en este proyecto, además de su especialidad.

          ## Siempre

          - [Ej.: Código, commits y documentación de la API en inglés; specs y textos para el usuario en español.]
          - [Ej.: Antes de cambiar código, leer la arquitectura y las pruebas del módulo.]

          ## Nunca

          - [Ej.: Tocar datos de producción ni secretos.]
          - [Ej.: Integrar sin que pasen lint, tipos y pruebas.]

          ## Comandos del proyecto

          ```bash
          # [instalar, probar, levantar]
          ```
      - kind: SPEC
        label: "Spec"
        scope: ISSUE
        required: true
        purpose: "Historias priorizadas, escenarios Dado/Cuando/Entonces, requisitos y criterios de éxito."
        pathPattern: "specs/{feature}/spec.md"
        writtenBy: PRODUCT_OWNER
        condition: ALWAYS
        agentInstructions: "Escribe la spec del issue en Markdown con las secciones de Spec Kit: «# Spec: <título>», «## Escenarios de usuario y pruebas» (historias priorizadas P1, P2… con escenarios Dado/Cuando/Entonces), «### Casos borde», «## Requisitos» con «### Requisitos funcionales» (FR-001…; marca cada duda como [NEEDS CLARIFICATION: pregunta]), «### Entidades clave» si hay datos, «## Criterios de éxito» (SC-001…, medibles) y «## Supuestos». Describe qué y por qué, nunca cómo implementarlo."
        template: |
          # Spec: {title}

          **Issue**: {key} | **Creada**: {date} | **Estado**: Borrador

          ## Escenarios de usuario y pruebas *(obligatorio)*

          ### Historia 1 · [título breve] (Prioridad: P1)

          [Qué necesita la persona usuaria, en lenguaje de negocio.]

          **Por qué esta prioridad**: [valor que entrega por sí sola]

          **Prueba independiente**: [cómo se verifica sin las demás historias]

          **Escenarios de aceptación**:

          1. **Dado** [estado inicial], **Cuando** [acción], **Entonces** [resultado esperado]
          2. **Dado** [estado inicial], **Cuando** [acción], **Entonces** [resultado esperado]

          ### Casos borde

          - ¿Qué pasa cuando [condición límite]?
          - ¿Cómo responde el sistema si [error]?

          ## Requisitos *(obligatorio)*

          ### Requisitos funcionales

          - **FR-001**: El sistema DEBE [capacidad concreta]
          - **FR-002**: El sistema DEBE [capacidad concreta]
          - **FR-003**: [NEEDS CLARIFICATION: pregunta concreta para una persona]

          ### Entidades clave *(si hay datos)*

          - **[Entidad]**: [qué representa y sus atributos principales, sin detalles de implementación]

          ## Criterios de éxito *(obligatorio)*

          - **SC-001**: [resultado medible, ej. "el 95 % de los usuarios completa X en menos de 1 minuto"]

          ## Supuestos

          - [Lo que se da por hecho y por qué es razonable]
      - kind: PLAN
        label: "Plan"
        scope: ISSUE
        required: false
        purpose: "Contexto técnico, verificación de la constitución y estructura."
        pathPattern: "specs/{feature}/plan.md"
        writtenBy: ARCHITECT
        condition: ALWAYS
        agentInstructions: "Escribe el plan de implementación en Markdown: «## Resumen», «## Contexto técnico», «## Diagrama de la solución» (en épicas, obligatorio: un bloque ```mermaid de la solución completa; en lo demás, opcional), «## Verificación de la constitución» (tabla principio / ¿cumple? / nota; toda excepción justificada), «## Estructura» (archivos y carpetas) y «## Complejidad y riesgos». Básate en la spec aprobada; no cambies su alcance."
        template: |
          # Plan de implementación: {title}

          **Issue**: {key} | **Fecha**: {date} | **Spec**: [spec.md](./spec.md)

          ## Resumen

          [Requisito principal y enfoque técnico elegido, en un párrafo.]

          ## Contexto técnico

          - **Lenguaje/versión**: [ej. Java 25]
          - **Dependencias principales**: [ej. Spring Boot 4.1]
          - **Almacenamiento**: [ej. PostgreSQL]
          - **Pruebas**: [ej. JUnit 5 + Testcontainers]
          - **Restricciones**: [rendimiento, seguridad, compatibilidad]

          ## Diagrama de la solución

          [En épicas, obligatorio: un bloque de código Mermaid con la solución completa y lo nuevo marcado.]

          ## Verificación de la constitución

          | Principio | ¿Cumple? | Nota |
          |---|---|---|
          | [I. ...] | Sí / No | [justificación] |

          ## Estructura

          ```text
          [archivos y carpetas que se crean o cambian]
          ```

          ## Complejidad y riesgos

          | Excepción o riesgo | Por qué es necesario | Alternativa descartada |
          |---|---|---|
      - kind: TASKS
        label: "Tareas"
        scope: ISSUE
        required: false
        purpose: "Tareas ordenadas y verificables derivadas del plan."
        pathPattern: "specs/{feature}/tasks.md"
        writtenBy: ARCHITECT
        condition: ALWAYS
        agentInstructions: null
        template: |
          # Tareas: {title}

          **Issue**: {key} | **Entrada**: [spec.md](./spec.md) y [plan.md](./plan.md)

          `[P]` = se puede hacer en paralelo (archivos distintos, sin dependencias).

          ## Fase 1 · Preparación

          - [ ] T001 [descripción con ruta del archivo]

          ## Fase 2 · Historia 1 (P1)

          - [ ] T002 [P] Prueba: [escenario de aceptación] en [ruta]
          - [ ] T003 Implementar [componente] en [ruta]

          ## Fase final · Cierre

          - [ ] T00N Verificar los escenarios de aceptación de la spec
  - key: ODD
    name: Organic Driven Development
    summary: "El proceso se ajusta a la complejidad y el riesgo de cada tarea: un cambio simple no lleva documentos; uno sustancial lleva un documento de seguimiento y un cierre con evidencia."
    agentRules:
      - "Autorizar: distingue si el issue pide solo investigar o también modificar. Sin permiso explícito, trabaja en solo lectura."
      - "Explorar: revisa los módulos, servicios y convenciones relevantes antes de proponer cambios."
      - "Resolver incertidumbre: investiga las dudas técnicas tú mismo y pregunta a una persona solo las decisiones de producto."
      - "Clasificar: evalúa el tamaño real por comprensión, riesgo y facilidad de revisión, no por cantidad de archivos."
      - "Registrar: si la tarea es sustancial, crea el documento de seguimiento; si es simple, no generes documentos."
      - "Implementar: usa el mecanismo más pequeño que aporte valor; para bugs, reproduce el fallo con una prueba antes de corregir."
      - "Cerrar: informa Implementado / Verificado / Pendiente. Lo que digas que funciona debe estar demostrado con evidencia."
    documents:
      - kind: PRODUCT
        label: "Producto"
        scope: PROJECT
        required: false
        purpose: "Usuarios, propósito y posicionamiento."
        pathPattern: "PRODUCT.md"
        writtenBy: null
        condition: ALWAYS
        agentInstructions: null
        template: |
          # Producto: {project}

          ## Usuarios

          - **Núcleo:** [quién usa el producto y en qué situación]
          - **Secundario:** [otros usuarios]

          ## Propósito

          [Qué problema resuelve y cómo se mide el éxito.]

          ## Posicionamiento

          [Qué lo diferencia de las alternativas.]

          ## Contexto operativo

          [Restricciones del negocio, regulación, idioma, horarios, integraciones locales.]
      - kind: ARCHITECTURE
        label: "Arquitectura"
        scope: PROJECT
        required: false
        purpose: "Módulos, servicios y convenciones a explorar antes de cambiar código."
        pathPattern: "docs/architecture.md"
        writtenBy: null
        condition: ALWAYS
        agentInstructions: null
        template: |
          # Arquitectura de {project}

          ## Stack

          | Área | Tecnología |
          |---|---|
          | Backend | [ej. Java 25 · Spring Boot · Modulith] |
          | Frontend | [ej. Next.js · React] |
          | Datos | [ej. PostgreSQL + Flyway] |

          ## Módulos

          | Módulo | Responsabilidad | API pública |
          |---|---|---|
          | [módulo] | [qué hace] | [interfaces o eventos] |

          ## Integraciones

          [Servicios externos y cómo se aíslan.]

          ## Decisiones (ADR)

          - **ADR-001 · [título]** ({date}): [decisión y motivo].
      - kind: GLOSSARY
        label: "Glosario"
        scope: PROJECT
        required: false
        purpose: "Términos del negocio."
        pathPattern: "docs/glossary.md"
        writtenBy: null
        condition: ALWAYS
        agentInstructions: null
        template: |
          # Glosario de {project}

