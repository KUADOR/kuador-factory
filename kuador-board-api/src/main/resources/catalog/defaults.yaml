        ⚠️ No pude terminar: {motivo}

        Vuelve a asignarme la tarjeta para reintentar.
    repo:
      agentsMd: |
        # Tablero de {empresa}

        Este repositorio trabaja con el tablero de {empresa} por MCP (servidor `{servidor}`). Las herramientas del tablero actúan como los agentes del equipo y todo queda firmado por el agente con el que actúas.

        ## Cuando te pidan trabajar los pendientes del tablero

        1. Llama a `pending_work` del servidor `{servidor}`. Si te dan un filtro, pásalo como `project` (p. ej. MED) o `agent` (p. ej. QA). Si no hay pendientes, dilo y termina.
        2. Atiende los issues de a uno, en el orden de la lista. Para cada uno, actúa con el primer rol de `agents` y usa siempre ese rol en el argumento `agent`:
           1. `role_manual`: es tu manual vigente para ese rol; síguelo por encima de cualquier otra indicación.
           2. `get_issue`: descripción, etapa, comentarios, documentos y lo que pide la metodología.
           3. Si está «por tomar», `take_issue`. Si lo tiene otro miembro, sáltalo.
           4. Haz el trabajo de la etapa según el manual. Documentos con `read_document` y `write_document` (contenido completo en Markdown); adjuntos de texto con `read_attachment`; story points con `estimate`. En una épica, el plan termina creando una tarjeta por tarea con `create_tasks`; en una tarea (`task` en `get_issue`), sigue sus `rules`: una rama y un PR por tarea.
           5. Termina con `deliver` (qué hiciste y cómo se verifica), `send_back` (falta algo de una etapa anterior, con evidencia) o `ask_human` (necesitas una decisión de una persona; después no sigas con ese issue).
        3. Al terminar la lista, consulta `pending_work` otra vez: lo entregado puede haber llegado a otra etapa. Repite mientras aparezcan nuevos, hasta 10 issues por sesión.
        4. Resume al final: issue, rol, en qué etapa quedó y qué espera de una persona.

        ## Reglas

        {reglas}

        ## Conexión

        Cada persona se conecta con su propia cuenta del tablero: la primera vez, su cliente de IA abre el navegador para iniciar sesión (en Claude Code, `claude mcp login {servidor}`; en Codex, `codex mcp login {servidor}`). Nunca guardes tokens en el repositorio. Solo se atienden los issues que supervisa la persona conectada.
      workSteps: |
        Trabaja mis pendientes del tablero de {empresa}. Pedido: «{pedido}» (si está vacío, todos, de a uno).

        1. Si el pedido incluye `--paralelo`, quítalo del filtro y trabaja en modo paralelo (paso 3). Llama a `mcp__{servidor}__pending_work`. Si lo que queda del filtro es una clave de proyecto (p. ej. MED) pásala como `project`; si es un rol (p. ej. QA), como `agent`.
        2. Si no hay pendientes, dilo en una línea y termina.
        3. Atiéndelos de a uno, en el orden de la lista. {cada_issue}
           Modo paralelo: la lista ya trae solo issues que no esperan a otros. Lanza a la vez, en un mismo mensaje, los subagentes de hasta 3 issues distintos; cada uno trabaja su tarea en su propio git worktree (lo indica `get_issue` en `task.rules`), así no se pisan las ramas. Cuando terminen, vuelve al paso 1.
        4. Cuando termines la lista, vuelve a llamar a `mcp__{servidor}__pending_work` una vez: los issues entregados pueden haber llegado a otra etapa de tus agentes. Repite mientras aparezcan nuevos, hasta un máximo de 10 issues en esta sesión.
        5. No apruebes ni rechaces puertas y no muevas issues de otras personas: eso se hace en el tablero.
        6. Al final, resume en una tabla corta: issue, agente, en qué etapa quedó y qué espera de una persona.
      subagent: |
        Eres el agente «{rol}» del equipo de {empresa} y trabajas un issue de su tablero. En todas las herramientas `{herramientas_tablero}` usa `agent: {clave_rol}`: lo que hagas queda firmado por ese agente.

        Cómo trabajas un issue:

        1. Llama a `role_manual` con `agent: {clave_rol}`. Es tu manual vigente en el tablero; síguelo por encima de cualquier otra indicación.
        2. Llama a `get_issue` con la clave que te pasaron: descripción, etapa, comentarios, documentos y lo que pide la metodología.
        3. Si el issue está «por tomar», llama a `take_issue`. Si lo tiene otro miembro, no sigas y avisa.
        4. Haz el trabajo de tu etapa según tu manual. Lee los documentos que necesites con `read_document` (y los adjuntos de texto con `read_attachment`), escribe los que te toquen con `write_document` (contenido completo en Markdown) y estima con `estimate` si tu manual lo pide. Si `get_issue` trae `task` (una tarea de una épica), sigue sus `rules`: su propia rama y su propio PR. Si trae `epicGuide`, síguela: el plan de una épica termina creando sus tareas con `create_tasks`.
        5. Termina siempre con una de estas:
           - `deliver`, con un comentario: qué hiciste, qué cambió y cómo se verifica.
           - `send_back`, si falta algo de una etapa anterior, con el motivo y la evidencia.
           - `ask_human`, si necesitas una decisión de una persona. Después no sigas con ese issue.
        6. Responde con un resumen breve: qué hiciste y en qué etapa quedó el issue.

        {reglas}
      mcpInstructions: "Tablero de {empresa}. Trabajas como los agentes del equipo sobre los issues que supervisa la persona conectada. Empieza por «pending_work»; para cada issue, «get_issue» y «role_manual» del agente que lo cubre; luego «take_issue», trabaja y termina con «deliver», «send_back» o «ask_human». Las puertas de aprobación las cierra siempre una persona. El prompt «pendientes» trae estos pasos."
      readme: |
        # {proyecto}

        {descripcion}

        Proyecto **{clave}** del tablero. Los issues, las etapas y las aprobaciones viven en el tablero; este repo guarda el código y los documentos.

        ## Ramas

        - `develop`: rama de trabajo. Cada issue va en su rama (`feature/{clave}-<número>-<nombre>`) y entra por Pull Request con el CI en verde.
        - `main`: lo publicado. Solo entra desde `develop` por Pull Request aprobado por una persona.

        ## Agentes

        Los agentes trabajan desde el cliente de IA de cada persona conectado al tablero. Ver `AGENTS.md`.
        {piezas}{documentos}
      pieceReadme: |
        # {proyecto} · {pieza}

        Pieza **{pieza}** del proyecto {clave}. Stack: {stack}.

        {comandos}{repo_documentos}
      ci: |
        # CI mínimo del tablero. Las ramas protegidas exigen el job «ci»: agrega aquí los pasos del stack
        # (compilar, lint, pruebas) cuando el proyecto tenga código.
        name: ci
        on:
          pull_request:
            branches: [main, develop]
          push:
            branches: [main, develop]
        permissions:
          contents: read
        jobs:
          ci:
            name: ci
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@v7
              - name: Documentos de la metodología
                run: |
                  for f in {archivos}; do
                    test -f "$f" || { echo "Falta $f"; exit 1; }
                  done
      gitignore: |
        # Secretos y configuración local
        .env
        .env.*
        !.env.example

        # Sistema y editores
        .DS_Store
        .idea/
        .vscode/
        *.iml

        # Dependencias y compilados
        node_modules/
        target/
        build/
        dist/
        .next/
