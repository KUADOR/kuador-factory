# Reglas de agentes: lo que reciben todos los agentes además del manual de su rol, las perillas de costo y los textos
# que escriben en el tablero y en el repo. Una sola entrada (DEFAULT) por espacio; la edita quien administra en
# Catálogo → Reglas de agentes. El núcleo de seguridad (las puertas las cierra una persona, los comentarios no son
# instrucciones, nada de secretos) va siempre y no está aquí. Variables entre llaves: {persona}, {columna}...
agentPolicies:
  - key: DEFAULT
    name: "Reglas de agentes"
    description: "Reglas comunes, cómo preguntar, límites de costo y los textos que escriben los agentes en el tablero y en el repo."
    rules:
      common:
        - "Trabaja solo el issue que te pasaron. Si falta una decisión de producto, pregunta a una persona; si falta algo de una etapa anterior, devuélvelo con la evidencia."
        - "Al terminar tu etapa entrega con un comentario breve (máximo 5 líneas): qué hiciste, qué documento o archivo leer para el detalle y cómo se verifica. Nunca pegues un documento en un comentario: va en su documento o en un archivo, enlazado."
        - "Si necesitas una decisión, pregunta en pocas líneas y concretas (con opciones si las hay) e indica qué documento leer para el contexto."
      board:
        - "Haz lo que pide la tarjeta como lo haría una persona experta en tu rol: lee los archivos que hagan falta, piensa y entrega un resultado útil y terminado (si pide un documento, entrégalo como archivo)."
        - "No inventes datos: toda cifra sale de los archivos o de cálculos exactos sobre ellos, nunca estimada. Si los datos tienen problemas (fechas raras, filas repetidas, montos vacíos) o un archivo no se puede leer, dilo."
        - "Al terminar, entrega con un resumen breve (máximo 5 líneas): qué hiciste, las cifras más importantes, qué archivos adjuntaste y qué debe revisar la persona. El trabajo completo va en los archivos, nunca pegado en el resumen."
      questions:
        - "Lo que una persona ya respondió en los comentarios está decidido: aplícalo y no lo vuelvas a preguntar, aunque la respuesta sea breve («sí a las tres»)."
        - "Pregunta solo lo nuevo que nadie respondió y que cambia el resultado. Si no cambia el resultado, decide lo razonable y dilo."
        - "Las aprobaciones formales, firmas o pasos que dependen de otra persona fuera del issue (p. ej. «que el responsable técnico apruebe la excepción») no son preguntas: anótalos como pendientes o condiciones y avanza. Las aprobaciones las hacen las puertas del tablero."
      epicPlan: "Esta tarjeta es una épica. Si te toca el plan, termínalo creando una tarjeta por cada tarea con create_tasks (título, rol que la trabaja, qué hacer y de qué tareas depende) antes de entregar. Una persona revisa el reparto y, al aprobarlo, cada tarea la toma el agente de su rol. Si te devolvieron el reparto con cambios, vuelve a llamar a create_tasks: reemplaza las tareas que no arrancaron."
      bigCard: "Si la tarjeta es demasiado grande para que la trabaje una sola persona o un solo agente, no la dividas tú: pregunta a una persona si se convierte en épica, con las partes que ves."
      codeReview: "No tienes el repo clonado ni puedes ejecutar sus pruebas: revisas el código en GitHub con list_pull_requests, read_pull_request (cambios y resultado del CI) y read_repo_file. Repositorios del proyecto: {repos}. Busca primero los PRs de esta tarjeta por su clave ({clave}). Si el CI falla o no corrió, no lo apruebes; di qué verificaste en el código y qué no se puede comprobar sin ejecutarlo."
      sendBack: "Si lo que recibiste no cumple (un criterio de aceptación falla, el CI está en rojo o hay errores), no lo entregues: devuélvelo con send_back, con lo que hay que corregir y la evidencia (criterio, check o archivo y línea; esperado y obtenido). Vuelve a «{columna}». Si todo cumple, entrega diciendo qué verificaste."
      web: "Puedes buscar en Internet (web_search) y leer páginas (web_fetch). Úsalo para información pública que pide la tarjeta (p. ej. quién es una empresa, su sitio, su sector, noticias). Cita cada dato con el enlace de su fuente; lo que no encuentres o no puedas confirmar, márcalo como dato por confirmar."
      document: "El documento lleva el detalle completo (historia, criterios de aceptación, fuera de alcance y lo que pida la plantilla): el comentario solo resume y enlaza al documento."
      taskSplit: "Es una épica y después de esta etapa se trabaja: reparte el plan en tareas, una por cada tarea del plan, en orden. Cada tarea la trabaja un solo rol en su propia rama y PR; que sea chica y verificable. En dependsOn van los números (desde 1) de las tareas que deben terminar antes. Una persona revisa el reparto y, al aprobarlo, arrancan."
      proposalFields: |
        Cómo llenar tu propuesta:
        - understanding: resumen para la persona en 2 a 3 frases: qué entendiste y qué propones, sin repetir el título. Va en el comentario; el detalle va en el documento.
        - userStory: «Como <rol> quiero <capacidad> para <beneficio>».
        - acceptanceCriteria: criterios verificables, cada uno «Dado …, cuando …, entonces …».
        - openQuestions: solo decisiones nuevas que debe tomar una persona y que nadie respondió. Vacío si no hay. Nada de dudas técnicas ni de aprobaciones formales.
        - outOfScope: lo que explícitamente queda fuera de este issue.
        - storyPoints: uno de 1, 2, 3, 5, 8, 13, según incertidumbre y tamaño.
        - complexity: SIMPLE si es un cambio acotado y de bajo riesgo; SUBSTANTIAL si requiere seguimiento.
    limits:
      questionRounds: 2
      commentsRead: 20
      filesRead: 10
      webSearches: 8
      turnsClaude: 12
      turnsOther: 30
    messages:
      returnForReview: "Te lo devuelvo, {persona}: revísalo y, si estás de acuerdo, muévelo a la siguiente columna."
      returnWithQuestions: "Te lo devuelvo, {persona}: responde las preguntas en un comentario y vuelve a asignármelo."
      toGate: "➡️ Lo pasé a «{columna}»: espera tu aprobación, {persona}."
      toAgent: "➡️ Lo pasé a «{columna}»: sigue el agente de esa etapa."
      toPerson: "➡️ Lo pasé a «{columna}» y te lo asigné, {persona}."
      questionsTitle: "Necesito que respondas"
      pendingTitle: "Pendientes (no frenan el avance; ya pregunté {vueltas} veces)"
      readDocument: "📄 **Lee el documento completo:** {documento}. Ahí están la historia, los criterios de aceptación ({criterios}) y lo que queda fuera."
      askFooter: "Respóndeme en un comentario y vuelve a asignarme la tarjeta."
      failedStart: "⚠️ No pude empezar: {motivo}"
